# Sequential adapter stacking. Asturian target, Spanish source.
#
# PREREQUISITE: run method2_es_source_adapter.yaml first — `sources.init_from`
# below points at the checkpoint it writes.
run_name      : method3_es_to_ast_stack_adapter
description   : "Method 3 stacking Stack(es, ast): frozen Spanish source adapter plus a fresh trainable Asturian adapter, trained on FLEURS ast_es and decoded through the <|es|> language token."
seed          : 42
log_dir       : ./logs/method3_es_to_ast_stack_adapter
checkpoint_dir: ./checkpoints/method3_es_to_ast_stack_adapter
results_dir   : ./results
resume_from   : null

norm_condition:
  train: basic
  eval:  full

data:
  languages      : [ast_es]
  train_manifest : ./manifests/ast_es/train.csv
  val_manifest   : ./manifests/ast_es/validation.csv
  train_datasets : [fleurs]
  val_datasets   : [fleurs]
  test_manifests :
    fleurs       : ./manifests/ast_es/test.csv
  max_duration_sec: 30.0
  min_duration_sec: 0.5
  num_workers     : 4

model:
  name           : openai/whisper-medium
  language       : spanish          # Whisper has no <|ast|> token; <|es|> is used as a proxy
  task           : transcribe
  dropout        : 0.1
  freeze_strategy: stacked_adapter
  adapter:
    name             : ast                     # the trainable target adapter
    composition      : [es, ast]               # Stack: es adapts first, ast composes on top
    reduction_factor : 4
    non_linearity    : "relu"
    dropout          : 0.05
    init_weights     : "mam_adapter"           # required for Pfeiffer bottleneck adapters
    sources:
      - name      : es                         # must match adapter.name in method 2
        init_from : ./checkpoints/method2_es_source_adapter/best/adapter

training:
  epochs              : 20
  batch_size          : 32
  grad_accum_steps    : 1
  lr                  : 3.0e-4
  weight_decay        : 0.01
  warmup_steps        : 80
  max_grad_norm       : 1.0
  mixed_precision     : "bf16"      # "no" | "fp16" | "bf16"
  checkpoint_metric   : wer
  early_stop_patience : 3

generation:
  num_beams      : 1
  max_new_tokens : 440
  batch_size     : 32
